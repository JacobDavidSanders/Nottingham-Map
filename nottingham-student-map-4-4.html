<style>
  :root{
    --ink: #16232c;
    --ink-soft: #22333f;
    --paper: #eef0f0;
    --line: rgba(255,255,255,0.09);
    --text-dim: #9db0bb;
    --gold: #d9a441;
    --uon: #2e9e46;
    --ntu: #8e44ad;
    --other: #2e86de;
    --sidebar-w: 340px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--ink);
    color: var(--paper);
  }

  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    overflow: hidden;
    transition: width 0.28s ease, margin-left 0.28s ease, opacity 0.2s ease, border-color 0.28s ease;
    z-index: 10;
  }

  #sidebar.collapsed {
    width: 0;
    min-width: 0;
    opacity: 0;
    pointer-events: none;
    border-color: transparent;
  }

  .sidebar-header {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--line);
  }

  .sidebar-header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 21px;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }

  .sidebar-header p {
    margin: 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  .search-box {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }

  .search-box input {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--ink-soft);
    color: var(--paper);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }

  .search-box input::placeholder { color: var(--text-dim); }
  .search-box input:focus { border-color: var(--gold); }

  .result-count {
    padding: 0 20px;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .layers {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 20px;
  }

  .layer-group { border-bottom: 1px solid var(--line); }

  .layer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 20px;
    cursor: pointer;
    user-select: none;
  }

  .layer-header:hover { background: var(--ink-soft); }

  .layer-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 500;
  }

  .layer-label input[type="checkbox"] {
    accent-color: var(--gold);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-uon { background: var(--uon); }
  .dot-ntu { background: var(--ntu); }
  .dot-other { background: var(--other); }

  .count-pill {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--ink-soft);
    padding: 2px 7px;
    border-radius: 10px;
  }

  .chevron {
    font-size: 11px;
    color: var(--text-dim);
    transition: transform 0.2s ease;
  }
  .layer-group.collapsed .chevron { transform: rotate(-90deg); }

  .place-list {
    list-style: none;
    margin: 0;
    padding: 0 0 8px;
    max-height: 260px;
    overflow-y: auto;
  }
  .layer-group.collapsed .place-list { display: none; }

  .place-list li {
    padding: 7px 20px 7px 39px;
    font-size: 13.5px;
    color: var(--text-dim);
    cursor: pointer;
    line-height: 1.3;
  }

  .place-list li:hover {
    background: var(--ink-soft);
    color: var(--paper);
  }

  .place-list li.hidden { display: none; }

  /* ---------- Map ---------- */
  #map-wrap {
    position: relative;
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    overflow: hidden;
  }

  #map {
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    background: var(--paper);
    border: 5px solid var(--ink-soft);
    box-shadow: 0 14px 34px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }

  /* thin, crisp inner edge line — no blur/gloss */
  #map::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
    pointer-events: none;
    z-index: 1000;
  }

  .leaflet-popup-content-wrapper {
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
  }
  .leaflet-popup-content b { font-family: 'Fraunces', serif; font-size: 15px; }

  #sidebarToggle {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 42px;
    height: 42px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  #sidebarToggle:hover { background: var(--ink-soft); }

  #bottomLeftStack {
    position: absolute;
    bottom: 24px;
    left: 16px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #fitBtn, #locateBtn {
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    text-align: left;
  }
  #fitBtn:hover, #locateBtn:hover { background: var(--ink-soft); }
  #locateBtn.active {
    border-color: var(--gold);
    color: var(--gold);
  }

  .you-are-here { position: relative; width: 20px; height: 20px; }
  .you-are-here .pulse {
    position: absolute;
    top: 50%; left: 50%;
    width: 12px; height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: rgba(46,134,222,0.55);
    animation: pulse-ring 1.8s ease-out infinite;
  }
  .you-are-here .dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 12px; height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: #2e86de;
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(3.4); opacity: 0; }
  }

  #zoomStack {
    position: absolute;
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
    z-index: 15;
    display: flex;
    flex-direction: column;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    border: 1px solid var(--line);
  }

  #zoomStack button {
    width: 40px;
    height: 40px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-bottom: 1px solid var(--line);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
  }
  #zoomStack button:last-child { border-bottom: none; }
  #zoomStack button:hover { background: var(--ink-soft); }

  #mapAttribution {
    position: absolute;
    bottom: 10px;
    right: 16px;
    z-index: 15;
    font-size: 10.5px;
    color: var(--text-dim);
    text-decoration: none;
    background: rgba(22,35,44,0.7);
    padding: 2px 8px;
    border-radius: 6px;
  }
  #mapAttribution:hover { color: var(--paper); }



  @media (max-width: 760px) {
    #sidebar {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: var(--sidebar-w);
      margin-left: calc(-1 * var(--sidebar-w));
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
      opacity: 1;
      pointer-events: auto;
    }
    #sidebar.open { margin-left: 0; }
    #sidebar.collapsed { width: var(--sidebar-w); min-width: var(--sidebar-w); }
    #zoomStack { right: 12px; }
  }
</style>
</head>

  { key: "university_of_nottingham_halls", label: "University of Nottingham Halls", color: "#2e9e46", dotClass: "dot-uon", markerColor: "green" },
  { key: "nottingham_trent_halls", label: "Nottingham Trent Halls", color: "#8e44ad", dotClass: "dot-ntu", markerColor: "violet" },
  { key: "other", label: "PBSA & Private Halls", color: "#2e86de", dotClass: "dot-other", markerColor: "blue" }
];

/* =========================================================
   MAP SETUP
   ========================================================= */
const map = L.map("map", {
  zoomControl: false,
  attributionControl: false,
  scrollWheelZoom: true,
  zoomSnap: 0.25,
  zoomDelta: 0.5,
  wheelPxPerZoomLevel: 130,
  wheelDebounceTime: 40,
  easeLinearity: 0.2,
  inertia: true,
  inertiaDeceleration: 2200,
  maxBounds: [[53.20, -1.55], [52.70, -0.75]],
  maxBoundsViscosity: 0.6
}).setView([52.955, -1.16], 13);

/* Zoom controls live outside the circle so they don't get clipped */
document.getElementById("zoomIn").addEventListener("click", () => map.zoomIn());
document.getElementById("zoomOut").addEventListener("click", () => map.zoomOut());

const mapboxToken =
  "pk.eyJ1IjoiYnJhbmNvbmluZSIsImEiOiJjbW10bXVidW4xbGI2MnRxdDRpMGN4MGZ0In0.fpixBJ5sOrCvYDpyZAehEw";

L.tileLayer(
  `https://api.mapbox.com/styles/v1/mapbox/light-v11/tiles/{z}/{x}/{y}?access_token=${mapboxToken}`,
  { tileSize: 512, zoomOffset: -1, minZoom: 9, maxZoom: 19 }
).addTo(map);

/* =========================================================
   MARKERS, CLUSTERS, SIDEBAR
   ========================================================= */
const layersEl = document.getElementById("layers");
const allBounds = [];
let totalPlaces = 0;

const clusterGroups = {};   // key -> markerClusterGroup
const markerIndex = {};     // key -> [{marker, li, name}]
const categoryBounds = {};  // key -> [[lat,lng], ...]
const categoryChecked = {}; // key -> boolean (is this layer currently visible)

categories.forEach(cat => {
  const icon = L.icon({
    iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${cat.markerColor}.png`,
    iconSize: [20, 32], iconAnchor: [10, 32], popupAnchor: [0, -28]
  });

  const cluster = L.markerClusterGroup({
    maxClusterRadius: 45,
    iconCreateFunction: cl => L.divIcon({
      html: `<div style="background:${cat.color};width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-family:Inter,sans-serif;font-size:13px;font-weight:600;border:2px solid rgba(255,255,255,0.85);box-shadow:0 2px 6px rgba(0,0,0,0.35);">${cl.getChildCount()}</div>`,
      className: "", iconSize: [34, 34]
    })
  });

  const list = data[cat.key];
  markerIndex[cat.key] = [];
  categoryBounds[cat.key] = [];
  categoryChecked[cat.key] = true;

  // group header
  const group = document.createElement("div");
  group.className = "layer-group";
  group.dataset.key = cat.key;
  group.innerHTML = `
    <div class="layer-header">
      <label class="layer-label">
        <input type="checkbox" checked data-toggle="${cat.key}">
        <span class="dot ${cat.dotClass}"></span>
        ${cat.label}
      </label>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="count-pill">${list.length}</span>
        <span class="chevron">▾</span>
      </div>
    </div>
    <ul class="place-list"></ul>
  `;
  layersEl.appendChild(group);

  const ul = group.querySelector(".place-list");
  const header = group.querySelector(".layer-header");
  header.addEventListener("click", (e) => {
    if (e.target.tagName === "INPUT") return;
    group.classList.toggle("collapsed");
  });

  const checkbox = group.querySelector('input[type="checkbox"]');
  checkbox.addEventListener("click", (e) => e.stopPropagation());
  checkbox.addEventListener("change", () => {
    categoryChecked[cat.key] = checkbox.checked;
    if (checkbox.checked) map.addLayer(cluster);
    else map.removeLayer(cluster);
  });

  list.forEach(p => {
    const appleMapsUrl = `https://maps.apple.com/?ll=${p.lat},${p.lng}&q=${encodeURIComponent(p.name)}`;
    const capacityLine = p.capacity
      ? `<br><span style="font-size:12px;color:#555;">Capacity: ~${p.capacity.toLocaleString()} students</span>`
      : `<br><span style="font-size:12px;color:#999;">Capacity: not listed</span>`;
    const marker = L.marker([p.lat, p.lng], { icon }).bindPopup(
      `<b>${p.name}</b><br><span style="color:${cat.color};font-size:12px;">${cat.label}</span>${capacityLine}<br><a href="${appleMapsUrl}" target="_blank" rel="noopener" style="font-size:12px;">Open in Apple Maps →</a>`
    );
    cluster.addLayer(marker);
    allBounds.push([p.lat, p.lng]);
    categoryBounds[cat.key].push([p.lat, p.lng]);
    totalPlaces++;

    const li = document.createElement("li");
    li.textContent = p.name;
    li.addEventListener("click", () => {
      map.flyTo([p.lat, p.lng], 17, { duration: 1.1, easeLinearity: 0.25 });
      marker.openPopup();
      if (window.innerWidth <= 760) sidebar.classList.remove("open");
    });
    ul.appendChild(li);

    markerIndex[cat.key].push({ marker, li, name: p.name.toLowerCase() });
  });

  cluster.addTo(map);
  clusterGroups[cat.key] = cluster;
});

document.getElementById("totalCount").textContent = `${totalPlaces} buildings mapped`;

/* =========================================================
   SEARCH
   ========================================================= */
const searchInput = document.getElementById("searchInput");
const resultCount = document.getElementById("resultCount");

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  let matches = 0;

  Object.entries(markerIndex).forEach(([key, entries]) => {
    let groupMatches = 0;
    entries.forEach(entry => {
      const isMatch = q === "" || entry.name.includes(q);
      entry.li.classList.toggle("hidden", !isMatch);
      if (isMatch) groupMatches++;
    });
    matches += groupMatches;

    const groupEl = layersEl.querySelector(`.layer-group[data-key="${key}"]`);
    if (q !== "" && groupMatches > 0) groupEl.classList.remove("collapsed");
  });

  resultCount.textContent = q === "" ? "" : `${matches} match${matches === 1 ? "" : "es"}`;
});

/* =========================================================
   UI CONTROLS
   ========================================================= */
const sidebar = document.getElementById("sidebar");
const mapEl = document.getElementById("map");
const mapWrap = document.getElementById("map-wrap");

function isMobile() { return window.innerWidth <= 760; }

/* Force the map to a true square (any mismatch here is what causes an oval) */
function sizeMap() {
  const pad = 80;
  const availW = mapWrap.clientWidth - pad;
  const availH = mapWrap.clientHeight - pad;
  const side = Math.max(180, Math.min(availW, availH, 640));
  mapEl.style.width = side + "px";
  mapEl.style.height = side + "px";
  map.invalidateSize();
}

window.addEventListener("resize", sizeMap);
sizeMap();

/* Now that the map has its real pixel size, do the initial "fit all pins" view */
map.invalidateSize();
map.fitBounds(allBounds, { padding: [30, 30] });

document.getElementById("sidebarToggle").addEventListener("click", () => {
  if (isMobile()) {
    sidebar.classList.toggle("open");
  } else {
    sidebar.classList.toggle("collapsed");
  }
  // resize mid-transition and once it finishes, so the circle re-centers smoothly
  sizeMap();
  setTimeout(sizeMap, 300);
});

document.getElementById("fitBtn").addEventListener("click", () => {
  // Only fit to categories that are currently switched on
  const visibleBounds = categories
    .filter(cat => categoryChecked[cat.key])
    .flatMap(cat => categoryBounds[cat.key]);

  if (visibleBounds.length === 0) return; // nothing selected, nothing to fit to

  map.flyToBounds(visibleBounds, { padding: [30, 30], duration: 1.1, easeLinearity: 0.25 });
});

/* =========================================================
   MY LOCATION
   ========================================================= */
const locateBtn = document.getElementById("locateBtn");
let userMarker = null;
let userAccuracy = null;
let watchId = null;

const youAreHereIcon = L.divIcon({
  className: "",
  html: '<div class="you-are-here"><div class="pulse"></div><div class="dot"></div></div>',
  iconSize: [20, 20],
  iconAnchor: [10, 10]
});

function onLocationFound(pos) {
  const { latitude, longitude, accuracy } = pos.coords;
  const latlng = [latitude, longitude];

  if (!userMarker) {
    userMarker = L.marker(latlng, { icon: youAreHereIcon, zIndexOffset: 1000 })
      .bindPopup("You are here")
      .addTo(map);
    userAccuracy = L.circle(latlng, {
      radius: accuracy, color: "#2e86de", weight: 1,
      fillColor: "#2e86de", fillOpacity: 0.12
    }).addTo(map);

    // Their real location may sit outside the Nottingham-only bounds — lift the restriction
    map.setMaxBounds(null);
    map.flyTo(latlng, 16, { duration: 1.3, easeLinearity: 0.25 });
  } else {
    userMarker.setLatLng(latlng);
    userAccuracy.setLatLng(latlng);
    userAccuracy.setRadius(accuracy);
  }
}

function onLocationError(err) {
  alert("Couldn't get your location: " + err.message);
  stopLocating();
}

function stopLocating() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  locateBtn.classList.remove("active");
  locateBtn.textContent = "📍 My location";
  if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
  if (userAccuracy) { map.removeLayer(userAccuracy); userAccuracy = null; }
}

locateBtn.addEventListener("click", () => {
  if (!navigator.geolocation) {
    alert("Geolocation isn't supported by this browser.");
    return;
  }
  if (watchId !== null) {
    stopLocating();
    return;
  }
  locateBtn.classList.add("active");
  locateBtn.textContent = "📍 Stop sharing";
  watchId = navigator.geolocation.watchPosition(onLocationFound, onLocationError, {
    enableHighAccuracy: true,
    maximumAge: 5000
  });
});
</script>
</body>
</html>
